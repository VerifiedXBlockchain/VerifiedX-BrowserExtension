<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VerifiedX Provider Demo</title>
  <style>
    :root {
      --primary: #3b82f6;
      --success: #22c55e;
      --error: #ef4444;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem;
    }

    .container { max-width: 700px; margin: 0 auto; }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    .subtitle { color: var(--muted); margin-bottom: 2rem; }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }

    .card h3 { margin-bottom: 0.5rem; }
    .card p { color: var(--muted); font-size: 0.875rem; margin-bottom: 0.5rem; }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 0.5rem;
      margin-right: 0.5rem;
    }

    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: #334155; }

    input, textarea {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: var(--text);
      font-size: 1rem;
      margin-top: 0.5rem;
    }

    .result {
      background: #0f172a;
      border-radius: 8px;
      padding: 1rem;
      margin-top: 1rem;
      word-break: break-all;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 0.8rem;
      max-height: 240px;
      overflow-y: auto;
    }

    .error { color: var(--error); }
  </style>
</head>
<body>
  <div class="container">
    <h1>VerifiedX Provider Demo</h1>
    <p class="subtitle">Connect to the VerifiedX extension and request signatures. The extension signs; this page never sees a key.</p>

    <div class="card">
      <h3>Extension</h3>
      <p id="status">Checking...</p>
    </div>

    <div class="card">
      <h3>Account</h3>
      <button id="connect">Connect</button>
      <button id="accounts" class="secondary">Get accounts</button>
      <button id="disconnect" class="secondary">Disconnect</button>
      <div id="accountResult" class="result" hidden></div>
    </div>

    <div class="card">
      <h3>Sign a message</h3>
      <textarea id="message" rows="3">Sign in to the VerifiedX provider demo</textarea>
      <button id="sign">Sign message</button>
      <div id="signResult" class="result" hidden></div>
    </div>

    <div class="card">
      <h3>Transaction</h3>
      <p>Send transactions only on testnet while trying this out.</p>
      <input id="to" placeholder="Recipient address">
      <input id="amount" placeholder="Amount (VFX)" value="0.01">
      <button id="signTx">Sign transaction</button>
      <button id="sendTx">Send transaction</button>
      <div id="txResult" class="result" hidden></div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    function show(id, value) {
      const el = $(id);
      el.hidden = false;
      el.classList.toggle('error', value instanceof Error);
      el.textContent = value instanceof Error
        ? `Error ${value.code ?? ''}: ${value.message}`
        : JSON.stringify(value, null, 2);
    }

    async function run(id, fn) {
      try {
        show(id, await fn());
      } catch (error) {
        show(id, error);
      }
    }

    function ready() {
      $('status').textContent = window.verifiedX
        ? 'Extension installed.'
        : 'Extension not found. Install the VerifiedX extension.';
    }

    window.addEventListener('verifiedX#initialized', ready);
    ready();

    $('connect').onclick = () => run('accountResult', () => window.verifiedX.connect());
    $('accounts').onclick = () => run('accountResult', () => window.verifiedX.getAccounts());
    $('disconnect').onclick = () => run('accountResult', () => window.verifiedX.disconnect());
    $('sign').onclick = () => run('signResult', () => window.verifiedX.signMessage($('message').value));

    const tx = () => ({ to: $('to').value.trim(), amount: $('amount').value.trim() });
    $('signTx').onclick = () => run('txResult', () => window.verifiedX.signTransaction(tx()));
    $('sendTx').onclick = () => run('txResult', () => window.verifiedX.sendTransaction(tx()));
  </script>
</body>
</html>
